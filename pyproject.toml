# Tooling configuration for the refl1d_models example repository.
#
# This repo is a curated collection of example reflectometry datasets and the
# plans/models produced from them (see README.md). It is NOT an installable
# Python package — tools consume the examples by cloning the repo and pointing
# at the folders under refl1d_models/ — so there is intentionally no
# build-system or [project] table here, only configuration for the development
# hygiene tooling run via pre-commit.

[tool.ruff]
line-length = 120
# The .py files under refl1d_models/ are example model artifacts (generated by
# create-model, or hand-written reference models) kept verbatim as tool output,
# not maintained source. Exclude them from linting and formatting.
extend-exclude = ["refl1d_models"]
lint.select = ["A", "ARG", "ASYNC", "BLE", "C90", "E", "F", "I", "N", "UP032", "W"]

[tool.codespell]
skip = "*.dat,*.txt"
